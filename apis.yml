description: Odyssey Therapeutics is a clinical-stage biopharmaceutical company developing small-molecule
  and biologic therapeutics for autoimmune, inflammatory, and oncology indications. The company targets
  upstream immune signaling mechanisms to prevent pathological inflammation rather than only suppressing
  downstream responses, advancing a pipeline of precision medicines. It operates as a private,
  venture-backed drug-discovery company with no public developer or API surface; this profile is
  maintained in the API Evangelist network as a company record.
